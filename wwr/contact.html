<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact White Water Rafting for reservations, general inquiries, and information about our exciting rafting adventures.">
    <meta name="author" content="Victor de Oliveira Madeiro Santos">
    <title>About us | White Water Rafting Company</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-raftingbw.png" alt="Rafting company logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>info@whitewater.com</p>
        </section>

        <div class="contact-container">
            <div class="map-container">
                <iframe src="https://www.google.com/maps/embed?pb=YOUR_MAP_LINK" loading="lazy"
                  allowfullscreen></iframe>
            </div>

            <section class="contact-form">
                <form>
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Placeholder" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Placeholder"
                          required>
                    </div>

                    <div class="form-group radio-group">
                        <label class="group-title">Message Purpose</label>
                        <div class="radio-options">
                            <label><input type="radio" name="purpose" value="general" checked>
                                General
                                Inquiry</label>
                            <label><input type="radio" name="purpose" value="reservation">
                                Reservation
                                Question</label>
                            <label><input type="radio" name="purpose" value="website">
                                Website
                                Suggestion</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4"
                          placeholder="Type here"></textarea>
                    </div>

                    <div class="form-group checkbox-group">
                        <label>
                            <input type="checkbox" id="checkbox" name="newsletter">
                            Please Subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit">Submit your Message</button>
                </form>
            </section>
        </div>

        <section class="employees">
            <h2>Our Team</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee-john.png" alt="John Smith">
                    <figcaption>John Smith - Lead River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee-sarah.png" alt="Sarah Brown">
                    <figcaption>Sarah Brown - Reservation Manager</figcaption>
                </figure>

                <figure>
                    <img src="images/employee-michael.png" alt="Michael Jones">
                    <figcaption>Michael Jones - Safety Instructor</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy;2026 White Water Rafting | Victor de Oliveira Madeiro Santos</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-bw.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-bw.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-bw.svg" alt="Instagram Icon">
            </a>
        </nav>

    </footer>
</body>

</html>
