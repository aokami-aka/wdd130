<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact White Water Rafting for reservations, general inquiries, and information about our exciting rafting adventures.">
    <meta name="author" content="Victor de Oliveira Madeiro Santos">
    <title>About us | Rafting Company</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-raftingbw.png" alt="Rafting company logo">

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-info">
            <h1>Contact Us</h1>

            <p><strong>White Water Rafting Company</strong></p>
            <p>123 Main iver Street</p>
            <p>Kolob, California</p>
            <p>Phone: +1 (999) 999-999</p>
            <p>Email: info@whitewater.com</p>

            <iframe src="https://www.google.com/maps/embed?pb=YOUR_MAP_LINK" loading="lazy"
              allowfullscreen></iframe>

        </section>

        <section class="employees">
            <h2>Meet Our Team</h2>

            <figure>
                <img src="images/employee-john.png" alt="John Smith">
                <figcaption>John Smith - Lead iver Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee-sarah.png" alt="Sarah Brown">
                <figcaption>Sarah Brown - Reservation Manager</figcaption>
            </figure>

            <figure>
                <img src="images/employee-michael.png" alt="Michael Jones">
                <figcaption>Michael Jones - Safety Instructor</figcaption>
            </figure>
        </section>

        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <p>Purpose of Message</p>

                <label>
                    <input type="radio" name="purpose" value="general" checked> General Inquiry
                </label>

                <label>
                    <input type="radio" name="purpose" value="reservation">
                    Reservation Question
                </label>

                <label>
                    <input type="radio" name="purpose" value="website">
                    Website Suggestion
                </label>

                <label for="message">Message</label>

                <textarea id="message" name="message" rows="6"></textarea>

                <label class="checkbox">
                    <input type="checkbox" name="newsletter">Please subscribe me to the monthly
                    newsletter
                </label>

                <button type="submit">Send My Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy;2026 White Water Rafting | Victor de Oliveira Madeiro Santos</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-bw.svg" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-bw.svg" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-bw.svg" alt="Instagram Icon">
            </a>
        </nav>

    </footer>
</body>

</html>
